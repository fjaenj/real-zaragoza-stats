<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<meta name="color-scheme" content="dark light">
<script>try{var t=JSON.parse(localStorage.getItem("rz2627_theme")||"\"auto\"");if(t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<title>Nobleza y valor</title>
<link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="icon" href="icons/nyv-favicon.png" type="image/png">

<body>
<header class="masthead">
  <div class="mh-bg" aria-hidden="true"></div>
  <div class="mh-actions">
    <button class="btn-theme" id="btnActa" title="Acta del partido (asistencias, xG, ajustes)">📝</button>
    <button class="btn-theme" id="btnTheme" title="Tema">◐</button>
    <button class="btn-update" id="btnUpdate" title="Descargar datos nuevos">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 4a8 8 0 0 1 7.4 5H17v2h6V5h-2v2.3A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8Zm8 8a8 8 0 0 1-15.4 3H7v-2H1v6h2v-2.3A10 10 0 0 0 22 12Z"/></svg>
      <span>Actualizar</span>

  </div>
  <div class="mh-center">
    <img class="mh-crest" src="icons/escudo.png" alt="Escudo del Real Zaragoza">

    <div class="mh-sub">Real Zaragoza · Temporada 26/27 · 1ª Federación · Grupo 2</div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-view="inicio" class="active"><i>⌂</i><span>Inicio</span></button>
  <button data-view="temporada"><i>📅</i><span>Temporada</span></button>
  <button data-view="estadisticas"><i>📈</i><span>Estadísticas</span></button>
  <button data-view="campeones"><i>🏆</i><span>Campeones</span></button>
  <button data-view="micro"><i>🎯</i><span>Microobjetivos</span></button>
  <button data-view="plantilla"><i>👥</i><span>Plantilla</span></button>
</nav>

<main id="app">
  <section class="view active" id="view-inicio"></section>
  <section class="view" id="view-temporada"></section>
  <section class="view" id="view-estadisticas"></section>
  <section class="view" id="view-campeones"></section>
  <section class="view" id="view-micro"></section>
  <section class="view" id="view-plantilla"></section>
  <section class="view" id="view-acta"></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script src="js/vendor/chart.umd.js?v=4.4.1"></script>
