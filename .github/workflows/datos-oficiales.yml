name: Datos oficiales

on:
  schedule:
    # Viernes a lunes cada 2 horas (días de partido) y martes a jueves una vez al día
    - cron: '25 */2 * * 5,6,0,1'
    - cron: '25 8 * * 2,3,4'
    # los horarios de la RFEF suelen salir entre semana por la tarde
    - cron: '25 17 * * 2,3,4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Jornadas a forzar (ej. 9,10)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: datos-oficiales
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Descargar fichas de partido de realzaragoza.com
        env:
          FORCE_J: ${{ github.event.inputs.force }}
        run: node tools/fetch_official.mjs
      - name: Horarios de la jornada (rfef.es) y calendarios
        continue-on-error: true
        env:
          FORCE_J: ${{ github.event.inputs.force }}
        run: python3 tools/horarios_rfef.py
      - name: Guardar cambios
        run: |
          git add -A data/official.json data/schedule.json cal
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "nobleza-y-valor-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Datos oficiales $(date -u +'%Y-%m-%d %H:%M')"
          git push
